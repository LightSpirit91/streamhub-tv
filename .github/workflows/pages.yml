# Publishes the web version to https://lightspirit91.github.io/streamhub-tv/
# on every push. Watch on any Mac, PC, iPhone or tablet browser.
name: Web app

on:
  push:
    branches: [claude/iptv-live-tv-app-8bs41s, main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Version shown in the app's corner: 1.<build number>, new on every update.
      - run: npx expo export --platform web --output-dir web-dist
        env:
          EXPO_PUBLIC_APP_VERSION: 1.${{ github.run_number }}
      - run: cp web-dist/index.html web-dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deploys wait their turn (never cancel each other); Pages can be slow when busy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1800000
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
