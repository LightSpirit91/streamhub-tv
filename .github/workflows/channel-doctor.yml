# Nightly self-healing library. Pulls every playlist, tests every stream,
# drops dead links, grows the movie library, builds the TV guide, and
# publishes everything to the `catalog` branch. The app reads from there.
name: Channel Doctor

on:
  schedule:
    - cron: '17 9 * * *' # ~4:17 AM Toronto
    - cron: '47 11 * * *' # backup ~6:47 AM: GitHub sometimes skips a scheduled run; does nothing if 4:17 worked
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with the TV guide refresh so two jobs never publish at once.
concurrency:
  group: catalog-branch
  cancel-in-progress: false

jobs:
  # Backup schedule: skip when tonight's catalog is already fresh (built in the last 6 hours).
  # Also honours "channelsEveryHours" in config/refresh.json (24 = nightly; 48 = every other night...).
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: config
      - id: fresh
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then exit 0; fi
          built=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/catalog/report.md" | grep -o 'Built [0-9T:.-]*Z' | cut -d' ' -f2)
          age=$(( $(date +%s) - $(date -d "${built:-1970-01-01}" +%s) ))
          hours=$(jq -r '.refresh.channelsEveryHours // 24' config/refresh.json 2>/dev/null | grep -E '^[0-9]+$' || echo 24)
          [ "$hours" -lt 24 ] && hours=24; [ "$hours" -gt 168 ] && hours=168
          if [ "$hours" -le 24 ]; then min=21600; else min=$(( (hours - 3) * 3600 )); fi
          echo "catalog age ${age}s, refresh every ${hours}h"
          if [ "$age" -lt "$min" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  doctor:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run
      - name: Restore yesterday's library
        run: |
          git clone -q --depth 1 -b catalog "https://github.com/${{ github.repository }}.git" prev || mkdir -p prev
          mkdir -p dist
          cp prev/*.json prev/*.md prev/*.csv dist/ 2>/dev/null || true
          # Translated subtitle files made on earlier nights.
          cp -r prev/subs dist/ 2>/dev/null || true
          # Week-long schedules collected by the TV Guide Plus job.
          cp -r prev/epg-grab dist/ 2>/dev/null || true
          # Audit history + snapshots, link health, and the daily discovery finds.
          cp -r prev/history prev/discovery dist/ 2>/dev/null || true
          cp prev/*.m3u dist/ 2>/dev/null || true
      - run: npx tsx scripts/channel-doctor.ts --check --previous prev --out dist
      - name: Channel previews
        continue-on-error: true
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          rm -rf dist/thumbs
          npx tsx scripts/thumb-doctor.ts --catalog dist/catalog.json --out dist --max 500
      - run: npx tsx scripts/movie-doctor.ts --limit 5000 --previous prev/movies.json --out dist
        continue-on-error: true
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      - run: npx tsx scripts/show-doctor.ts --limit 2500 --previous prev/shows.json --out dist
        continue-on-error: true
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      - run: npx tsx scripts/tmdb-doctor.ts --out dist
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: npx tsx scripts/epg-doctor.ts --catalog dist/catalog.json --out dist
        continue-on-error: true
      - name: Audit log, snapshot, status
        run: npx tsx scripts/history.ts --dist dist --previous prev --job "Channel Doctor"
      - name: Publish to catalog branch
        run: |
          cd dist
          rm -rf .git
          git init -q -b catalog
          git config user.name "channel-doctor"
          git config user.email "channel-doctor@users.noreply.github.com"
          git add -A
          git commit -qm "Catalog $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalog
      - name: Job summary
        run: cat dist/report.md dist/thumbs-report.md dist/movies-report.md dist/shows-report.md dist/tmdb-report.md dist/epg-report.md dist/discovery/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
