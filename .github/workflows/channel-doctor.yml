# Nightly self-healing library. Pulls every playlist, tests every stream,
# drops dead links, grows the movie library, builds the TV guide, and
# publishes everything to the `catalog` branch. The app reads from there.
name: Channel Doctor

on:
  schedule:
    - cron: '17 9 * * *' # ~4:17 AM Toronto
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with the TV guide refresh so two jobs never publish at once.
concurrency:
  group: catalog-branch
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run
      - name: Restore yesterday's library
        run: |
          git clone -q --depth 1 -b catalog "https://github.com/${{ github.repository }}.git" prev || mkdir -p prev
          mkdir -p dist
          cp prev/*.json prev/*.md prev/*.csv dist/ 2>/dev/null || true
      - run: npx tsx scripts/channel-doctor.ts --check --previous prev --out dist
      - name: Channel previews
        continue-on-error: true
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          rm -rf dist/thumbs
          npx tsx scripts/thumb-doctor.ts --catalog dist/catalog.json --out dist --max 500
      - run: npx tsx scripts/movie-doctor.ts --limit 5000 --previous prev/movies.json --out dist
        continue-on-error: true
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      - run: npx tsx scripts/show-doctor.ts --limit 2500 --previous prev/shows.json --out dist
        continue-on-error: true
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      - run: npx tsx scripts/youtube-doctor.ts --previous prev --out dist
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npx tsx scripts/tmdb-doctor.ts --out dist
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: npx tsx scripts/epg-doctor.ts --catalog dist/catalog.json --out dist
        continue-on-error: true
      - name: Publish to catalog branch
        run: |
          cd dist
          rm -rf .git
          git init -q -b catalog
          git config user.name "channel-doctor"
          git config user.email "channel-doctor@users.noreply.github.com"
          git add -A
          git commit -qm "Catalog $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalog
      - name: Job summary
        run: cat dist/report.md dist/thumbs-report.md dist/movies-report.md dist/shows-report.md dist/youtube-report.md dist/tmdb-report.md dist/epg-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
